# Project-specific rules overlay. Merged on top of the embedded preset by
# rule id (same id → replace, new id → append).
#
# Workspace layout: `crates/{core,workspace,check,cli}/src/...`. A file at
# `crates/core/src/lang/ts/walker.rs` is scanned from the workspace root
# and encoded as
# `dir:crates/dir:core/dir:src/dir:lang/dir:ts/module:walker`.
# Aliases below pin patterns to that encoding.

[aliases]
# Standalone crates (each at `crates/<name>/`). The crate dirs are unique
# top-level names, so anchoring on `dir:crates/dir:<name>` is unambiguous.
crate_core = "moniker ~ '**/dir:crates/dir:core/dir:src/**'"
crate_workspace = "moniker ~ '**/dir:crates/dir:workspace/dir:src/**'"
crate_check = "moniker ~ '**/dir:crates/dir:check/dir:src/**'"
crate_query = "moniker ~ '**/dir:crates/dir:query/dir:src/**'"
crate_daemon = "moniker ~ '**/dir:crates/dir:daemon/dir:src/**'"
crate_daemon_client = "moniker ~ '**/dir:crates/dir:daemon-client/dir:src/**'"
crate_cli  = "moniker ~ '**/dir:crates/dir:cli/dir:src/**'"
daemon_target = """
  target ~ '**/external_pkg:code_moniker_daemon'
  OR target ~ '**/external_pkg:code_moniker_daemon/**'
"""
daemon_client_target = """
  target ~ '**/external_pkg:code_moniker_daemon_client'
  OR target ~ '**/external_pkg:code_moniker_daemon_client/**'
"""
query_target = """
  target ~ '**/external_pkg:code_moniker_query'
  OR target ~ '**/external_pkg:code_moniker_query/**'
"""
workspace_public_boundary_target = """
  target ~ '**/external_pkg:code_moniker_workspace'
  OR target ~ '**/external_pkg:code_moniker_workspace/path:LocalWorkspaceRegistry'
  OR target ~ '**/external_pkg:code_moniker_workspace/path:/^(cache|changes|code|environment|extract|facade|glob|lang|lines|linkage|live|notes|registry|snapshot|source|sources|tsconfig|walk)$/**'
"""
workspace_crate_target = "target ~ '**/external_pkg:code_moniker_workspace/**'"
cli_workspace_index = "moniker ~ '**/dir:crates/dir:cli/dir:src/module:workspace_index'"
workspace_notes_persistence_target = """
  target ~ '**/external_pkg:code_moniker_workspace/path:notes/path:/^(NotesStore|notes_dir|notes_path|notes_root_for_paths)$/'
  OR target ~ '**/external_pkg:code_moniker_workspace/path:notes/path:store/**'
"""
workspace_notes_state_target = "target ~ '**/external_pkg:code_moniker_workspace/path:notes/path:WorkspaceNotes'"
workspace_live_watch_roots_builder_target = "target ~ '**/external_pkg:code_moniker_workspace/path:live/path:watch_roots_for_paths'"
workspace_live_public_contract_target = """
  target ~ '**/external_pkg:code_moniker_workspace/path:live'
  OR target ~ '**/external_pkg:code_moniker_workspace/path:live/path:/^(LiveWorkspaceWatcher|WorkspaceLiveEvent|WorkspaceLiveRefreshPlan|WorkspaceWatchRoot)$/'
"""
# Per-crate integration tests / examples.
tests             = "moniker ~ '**/dir:tests/**'"
rust_inline_tests = "moniker ~ '**/module:tests/**'"
example           = "moniker ~ '**/dir:examples/**'"
rust_production_source = "moniker ~ '**/dir:crates/dir:/^(check|cli|core|workspace|query|daemon|daemon-client)$/dir:src/**'"
rust_test_support = """
  moniker ~ '**/dir:crates/dir:cli/dir:src/module:ui/module:acceptance/**'
  OR moniker ~ '**/dir:crates/dir:check/dir:src/module:check/module:expr/module:/^(snapshots|fuzz)$/**'
"""
rust_test_caller = """
  source.kind = 'test'
  OR source ~ '**/dir:tests/**'
  OR source ~ '**/module:tests/**'
  OR source ~ '**/dir:examples/**'
  OR source ~ '**/dir:crates/dir:cli/dir:src/module:ui/module:acceptance/**'
  OR source ~ '**/dir:crates/dir:check/dir:src/module:check/module:expr/module:/^(snapshots|fuzz)$/**'
"""
mcp_tool_contract = "moniker ~ '**/dir:crates/dir:cli/dir:src/module:mcp/module:tools/**' AND kind = 'method' AND name =~ ^output_contract"
mcp_tool_input_schema = "moniker ~ '**/dir:crates/dir:cli/dir:src/module:mcp/module:tools/**' AND kind = 'method' AND name =~ ^input_schema"
mcp_registry_output = "kind = 'method' AND name =~ ^(call|finalize_error) AND uri ~ '**/module:mcp/module:tools/struct:ToolRegistry/**'"
mcp_output_finalize = "kind = 'method' AND name =~ ^finalize AND uri ~ '**/module:mcp/module:tools/enum:OutputContract/**'"
mcp_compact_renderer = "kind = 'fn' AND name =~ ^compact_response_monikers AND uri ~ '**/module:mcp/module:tools/module:common/**'"
mcp_shared_compact_identity = "kind = 'fn' AND name =~ ^compact_identity AND uri ~ '**/dir:crates/dir:workspace/dir:src/module:code/module:symbols/**'"
mcp_budget_renderer = "kind = 'fn' AND name =~ ^apply_output_budget AND uri ~ '**/module:mcp/module:tools/module:common/**'"
syntax_tree_query = "kind = 'struct' AND name = 'SyntaxTreeQuery' AND moniker ~ '**/dir:crates/dir:query/dir:src/module:lib/**'"
syntax_tree_response = "kind = 'fn' AND name =~ ^syntax_tree_response AND moniker ~ '**/dir:crates/dir:daemon/dir:src/module:syntax/**'"
syntax_parse_query = "kind = 'struct' AND name = 'SyntaxParseQuery' AND moniker ~ '**/dir:crates/dir:query/dir:src/module:lib/**'"
syntax_parse_response = "kind = 'fn' AND name =~ ^syntax_parse_response AND moniker ~ '**/dir:crates/dir:daemon/dir:src/module:syntax/**'"
query_snapshot_requirement = "kind = 'method' AND name =~ ^requires_workspace_snapshot AND moniker ~ '**/dir:crates/dir:query/dir:src/module:lib/**'"
mcp_daemon_runtime_query = "kind = 'method' AND name =~ ^query AND moniker ~ '**/dir:crates/dir:cli/dir:src/module:mcp/module:context/enum:DaemonRuntime/**'"
daemon_handle_query = "kind = 'fn' AND name =~ ^handle_query AND moniker ~ '**/dir:crates/dir:daemon/dir:src/module:lib/**'"
language_parse_source = "kind = 'fn' AND name =~ ^parse_source AND moniker ~ '**/dir:crates/dir:core/dir:src/module:lang/**'"
syntax_tree_limit_validator = "kind = 'fn' AND name =~ ^validate_limits AND moniker ~ '**/dir:crates/dir:daemon/dir:src/module:syntax/**'"
language_extractor_contract = "kind = 'trait' AND name = 'LangExtractor' AND moniker ~ '**/dir:crates/dir:core/dir:src/module:lang/module:extractor/**'"
parsed_document_contract = "kind = 'struct' AND name = 'ParsedDocument' AND moniker ~ '**/dir:crates/dir:core/dir:src/module:lang/module:document/**'"
language_sdk_pipeline_extract = "kind = 'fn' AND name = 'extract' AND moniker ~ '**/dir:crates/dir:core/dir:src/module:lang/**/module:sdk_pipeline/**'"
mcp_read_input_schema = "kind = 'method' AND name =~ ^input_schema AND moniker ~ '**/module:read/**'"
mcp_read_ast_schema = "kind = 'fn' AND name =~ ^read_input_schema AND moniker ~ '**/module:read/**'"
daemon_registry_entry_contract = "kind = 'struct' AND moniker ~ '**/dir:crates/dir:query/dir:src/module:discovery/struct:DaemonRegistryEntry'"
workspace_status_contract = "kind = 'struct' AND moniker ~ '**/dir:crates/dir:query/dir:src/module:lib/struct:WorkspaceStatus'"
daemon_client_transport_wait = "kind = 'fn' AND name = 'wait_for_daemon_with_limits' AND moniker ~ '**/dir:crates/dir:daemon-client/dir:src/**'"
daemon_client_process_spawn = "kind = 'fn' AND name = 'start_daemon_process' AND moniker ~ '**/dir:crates/dir:daemon-client/dir:src/**'"
daemon_client_compatibility_policy = "kind = 'fn' AND name = 'compatibility_action' AND moniker ~ '**/dir:crates/dir:daemon-client/dir:src/**'"
mcp_preload_gate = "kind = 'fn' AND name = 'ensure_workspace_available' AND moniker ~ '**/dir:crates/dir:cli/dir:src/module:mcp/module:context/**'"
mcp_lifecycle_projection = "kind = 'fn' AND name = 'project_workspace_lifecycle' AND moniker ~ '**/dir:crates/dir:cli/dir:src/module:mcp/module:context/**'"
daemon_registry_claim_maintenance = "kind = 'fn' AND name = 'maintain_registry_claim' AND moniker ~ '**/dir:crates/dir:daemon/dir:src/module:lib/**'"
daemon_registry_entry_read = "kind = 'fn' AND name = 'read_registry_entry' AND moniker ~ '**/dir:crates/dir:query/dir:src/module:discovery/**'"
daemon_registry_owned_update = "kind = 'fn' AND name = 'update_registry_entry_if_own' AND moniker ~ '**/dir:crates/dir:query/dir:src/module:discovery/**'"
source_group_config_scope = "kind = 'fn' AND name = 'ensure_source_groups_owned_by_project_root' AND moniker ~ '**/dir:crates/dir:check/dir:src/module:check/module:config/**'"
source_group_root_identity = "kind = 'fn' AND name = 'is_project_root_config' AND moniker ~ '**/dir:crates/dir:check/dir:src/module:check/module:config/**'"
ruleset_config_loader = "kind = 'method' AND name = 'load_config' AND moniker ~ '**/dir:crates/dir:check/dir:src/module:check/module:command/struct:RuleSetRequest/**'"
check_request_constructor = "kind = 'method' AND name = 'new' AND moniker ~ '**/dir:crates/dir:check/dir:src/module:check/module:command/struct:CheckRequest/**'"
source_group_fragment_parser = "kind = 'fn' AND name = 'parse_fragment' AND moniker ~ '**/dir:crates/dir:check/dir:src/module:check/module:config/module:fragments/**'"
source_group_membership_projection = "kind = 'fn' AND name = 'configured_source_membership' AND moniker ~ '**/dir:crates/dir:workspace/dir:src/module:sources/**'"
source_file_extraction_context = "kind = 'method' AND name = 'extraction_context' AND moniker ~ '**/dir:crates/dir:workspace/dir:src/module:sources/struct:SourceFile/**'"
source_group_linkage_lookup = "kind = 'fn' AND name = 'group_of' AND moniker ~ '**/dir:crates/dir:workspace/dir:src/module:linkage/module:source_groups/**'"
node_daemon_process_spawn = "kind = 'fn' AND name = 'tryLaunchDetached' AND moniker ~ '**/dir:packages/dir:client/dir:src/module:node/**'"
vscode_daemon_session = "kind = 'class' AND name = 'DaemonSession' AND moniker ~ '**/dir:vscode-extension/dir:src/module:daemon/module:session/**'"
vscode_daemon_connect_policy = "kind = 'method' AND name = 'doConnect' AND moniker ~ '**/dir:vscode-extension/dir:src/module:daemon/module:session/**'"
daemon_lifecycle_consumer = """
  moniker ~ '**/dir:crates/dir:cli/dir:src/module:query/**'
  OR moniker ~ '**/dir:crates/dir:cli/dir:src/module:mcp/module:context/**'
  OR moniker ~ '**/dir:packages/dir:client/dir:src/module:node/**'
  OR moniker ~ '**/dir:vscode-extension/dir:src/module:daemon/module:session/**'
"""

[exclude]
uris = [
  "**/crates/core/tests/fixtures/**",
  "**/crates/tree-sitter-plpgsql/src/parser.c",
  "**/crates/tree-sitter-plpgsql/src/scanner.c",
  "**/crates/tree-sitter-plpgsql/src/tree_sitter/**",
  "**/vscode-extension/dist/**",
  "**/vscode-extension/media/**",
]

[profiles.agent]
enable = [".*"]

[profiles.smells]
enable = ["\\.smell-"]

# ─── Agent output boundary ──────────────────────────────────────────────

[[workspace.path]]
id        = "mcp-compaction-owned-by-output-boundary"
severity  = "error"
from      = "$mcp_registry_output"
to        = "$mcp_compact_renderer"
via       = "$mcp_output_finalize"
expect    = "all_paths_via"
require_non_empty = true
relation  = ["calls", "method_call"]
max_depth = 8
max_symbols = 200
max_edges = 500
max_pairs = 20
min_coverage = 30
message   = "MCP compaction bypasses `OutputContract::finalize`: {path}"
rationale = """
Agent-facing responses are compact by default. Every registry path to the moniker
compactor must cross the single output boundary so individual MCP tools cannot drift
into mixed URI formats or apply transformations in a different order. Body monikers
and generated follow-up calls intentionally share this same transformation.
"""

[[workspace.path]]
id        = "mcp-compaction-reuses-shared-identity-renderer"
severity  = "error"
from      = "$mcp_compact_renderer"
to        = "$mcp_shared_compact_identity"
expect    = "reachable"
require_non_empty = true
relation  = ["calls", "method_call"]
max_depth = 4
max_symbols = 50
max_edges = 100
max_pairs = 4
min_coverage = 100
message   = "MCP compaction no longer reuses the workspace compact identity renderer: {path}"
rationale = """
The MCP output boundary may add presentation aliases such as `workspace`, but symbol
monikers must keep using the one workspace-owned compact representation. This prevents
follow-ups and response bodies from inventing a transport-specific URI dialect.
"""

[[workspace.path]]
id        = "mcp-budget-owned-by-output-boundary"
severity  = "error"
from      = "$mcp_registry_output"
to        = "$mcp_budget_renderer"
via       = "$mcp_output_finalize"
expect    = "all_paths_via"
require_non_empty = true
relation  = ["calls", "method_call"]
max_depth = 8
max_symbols = 200
max_edges = 500
max_pairs = 20
min_coverage = 30
message   = "MCP output budgeting bypasses `OutputContract::finalize`: {path}"
rationale = """
The hard response ceiling belongs to the same boundary as compaction. Central ownership
keeps the public schema, validation, transformation order, and truncation behavior aligned.
"""

[[rust.shape.callable.where]]
id        = "mcp-output-finalizer-applies-compact-before-budget"
severity  = "error"
expr      = "NOT (parent.name = 'OutputContract' AND name =~ ^finalize) OR text =~ '(?s)compact_response_monikers.*apply_output_budget'"
message   = "`OutputContract::finalize` must apply moniker compaction before the hard output budget."
rationale = "The boundary contract is incomplete if either transformation disappears or their order is reversed."

[[rust.shape.callable.where]]
id        = "mcp-output-contract-publishes-agent-options"
severity  = "error"
expr      = "NOT (parent.name = 'OutputContract' AND name =~ ^decorates_schema) OR (any(out_refs, kind = 'calls' AND target.name = 'add_compact_output_schema') AND any(out_refs, kind = 'calls' AND target.name = 'add_output_budget_schema'))"
message   = "`OutputContract` must publish compact and hard-budget options for agent-facing tools."
rationale = "The public MCP contract must expose the token-economy controls from the same central boundary."

[[rust.shape.callable.where]]
id        = "mcp-output-contract-validates-agent-options"
severity  = "error"
expr      = "NOT (parent.name = 'OutputContract' AND name =~ ^validate_arguments) OR (any(out_refs, kind = 'calls' AND target.name = 'compact_argument') AND any(out_refs, kind = 'calls' AND target.name = 'validate_output_budget'))"
message   = "`OutputContract` must validate compact and hard-budget arguments before tool execution."
rationale = "Central schema ownership is incomplete if individual tools can receive unchecked transport options."

[[rust.shape.callable.where]]
id        = "mcp-agent-tools-declare-agent-output-contract"
severity  = "error"
expr      = "NOT $mcp_tool_contract OR parent.name =~ ^(McpTool|RefreshTool)$ OR text =~ 'OutputContract::Agent'"
message   = "Every agent-facing MCP tool must explicitly return `OutputContract::Agent`."
rationale = """
The trait makes the decision explicit for every tool, while this open selector prevents
existing and newly added tools from opting out through the plain contract. Refresh is the
only explicit exception because it returns a small operational acknowledgement.
"""

[[rust.shape.callable.where]]
id        = "mcp-tool-schemas-do-not-own-output-contract-options"
severity  = "error"
expr      = "NOT $mcp_tool_input_schema OR text !~ '\"(compact|budget|max_chars)\"\\s*:'"
message   = "Per-tool schemas must not redeclare `compact`, `budget`, or `max_chars`; `OutputContract` owns them."
rationale = "One schema owner prevents new or renamed MCP tools from losing or redefining token-economy controls."

[[refs.where]]
id        = "mcp-tools-do-not-bypass-output-finalizer"
severity  = "error"
expr      = "NOT ($rust_production_source AND kind = 'calls' AND target.name = 'compact_response_monikers') OR $rust_test_caller OR source.name =~ ^finalize"
message   = "Production code may call `compact_response_monikers` only from `OutputContract::finalize`."
rationale = "Distributed renderer calls recreate mixed canonical and compact URI output."

[[refs.where]]
id        = "mcp-tools-do-not-bypass-output-budget"
severity  = "error"
expr      = "NOT ($rust_production_source AND kind = 'calls' AND target.name = 'apply_output_budget') OR $rust_test_caller OR source.name =~ ^finalize"
message   = "Production code may call `apply_output_budget` only from `OutputContract::finalize`."
rationale = "Distributed budgeting creates inconsistent ceilings and allows error paths to escape the public contract."

# ─── Graph query truth and completeness ────────────────────────────

[[rust.shape.type.where]]
id        = "graph-results-publish-coverage"
severity  = "warn"
expr      = "name !~ ^(IdentityGraphResult|SymbolGraphResult)$ OR text =~ 'pub coverage\\s*:'"
message   = "Graph result `{name}` should publish explicit coverage instead of leaving filtered or paged counts implicit."
rationale = "Agents must distinguish total, matching, and returned graph facts; an unlabeled zero is not a trustworthy architecture fact."

[[rust.shape.callable.where]]
id        = "identity-graph-uses-generation-aware-pagination"
severity  = "warn"
expr      = "name !~ ^page_identity_graph OR any(out_refs, kind = 'calls' AND target.name = 'page_rows')"
message   = "`page_identity_graph` should use the shared generation-aware paginator."
rationale = "Large architecture maps must be completely retrievable with stable cursors instead of relying on larger output budgets."

[[rust.shape.callable.where]]
id        = "descendant-usage-rollup-deduplicates-references"
severity  = "warn"
expr      = "name !~ ^symbol_usages_response OR any(out_refs, kind = 'calls' AND target.name = 'deduplicate_usage_rows')"
message   = "Descendant usage roll-up should deduplicate reference facts before summaries and pagination."
rationale = "One reference may be discovered through several owned members or alias paths; owner-level coupling must not double count it."

[[rust.shape.callable.where]]
id        = "descendant-usage-rollup-uses-symbol-ownership"
severity  = "warn"
expr      = "name !~ ^symbol_usages_response OR any(out_refs, kind = 'calls' AND target.name = 'symbol_is_owned_by')"
message   = "Descendant usage roll-up should follow indexed symbol ownership instead of matching identity strings."
rationale = "Textual identity prefixes can collide across source sets or roots; the parent relation is the architectural ownership boundary."

# ─── On-demand syntax tree boundary ─────────────────────────────────

[[rust.shape.type.where]]
id        = "language-sdk-owns-shared-parsed-document"
severity  = "error"
expr      = "NOT $language_extractor_contract OR text =~ '(?s)fn parse\\(.*-> ParsedDocument.*fn extract_parsed\\(.*document: &ParsedDocument.*let document = Self::parse\\(.*Self::extract_parsed\\('"
message   = "`LangExtractor` must parse once into `ParsedDocument` and pass that document to semantic extraction."
rationale = """
AST rendering and graph extraction are consumers of one language SDK pipeline.
Returning a raw tree to one consumer while allowing another to parse privately
recreates divergent syntax behavior, especially for embedded languages.
"""

[[rust.shape.type.where]]
id        = "parsed-document-supports-language-injections"
severity  = "error"
expr      = "NOT $parsed_document_contract OR text =~ '(?s)primary: Tree.*injections: Vec<SyntaxInjection>'"
message   = "`ParsedDocument` must retain both the primary tree and embedded-language injections."
rationale = "Embedded syntax is part of the common language SDK contract, not a daemon- or extractor-specific side channel."

[[rust.shape.callable.where]]
id        = "language-sdk-pipelines-consume-parsed-document"
severity  = "error"
expr      = "NOT $language_sdk_pipeline_extract OR (text =~ 'document: &ParsedDocument' AND NOT text =~ '(?s)let tree = .*parse')"
message   = "Every language SDK extraction pipeline must consume `ParsedDocument` without reparsing the source."
rationale = "This makes the shared parse result mandatory for all registered language pipelines and catches a private second parser before it reaches MCP."

[[rust.shape.callable.where]]
id        = "syntax-tree-response-consumes-language-sdk-document"
severity  = "error"
expr      = "NOT $syntax_tree_response OR text =~ '(?s)let document = lang\\.parse\\(.*document\\.primary\\(.*render_document\\(.*&document'"
message   = "The daemon AST response must consume the parsed document returned by the language SDK."
rationale = "This rule would catch a regression back to a raw generic parser or a daemon-only embedded-language pipeline."

[[rust.shape.callable.where]]
id        = "stateless-syntax-response-consumes-language-sdk"
severity  = "error"
expr      = "NOT $syntax_parse_response OR (text =~ '(?s)parse_source\\(.*render_document\\(' AND NOT text =~ 'WorkspaceSnapshot')"
message   = "The stateless AST response must parse through the shared language SDK and shared renderer."
rationale = "Direct source parsing must not introduce a second language pipeline or a different AST representation."

[[rust.shape.callable.where]]
id        = "syntax-parse-does-not-require-workspace-snapshot"
severity  = "error"
expr      = "NOT $query_snapshot_requirement OR text =~ '(?s)!matches!\\(.*SyntaxParse'"
message   = "`Query::requires_workspace_snapshot` must classify `SyntaxParse` as stateless."
rationale = "The MCP in-process runtime uses this protocol property to bypass workspace preload for direct source parsing."

[[rust.shape.callable.where]]
id        = "mcp-runtime-honors-stateless-query-contract"
severity  = "error"
expr      = "NOT $mcp_daemon_runtime_query OR text =~ '(?s)requires_workspace_snapshot\\(\\).*ensure_workspace_available'"
message   = "The MCP in-process runtime must consult the query snapshot contract before waiting for preload."
rationale = "Otherwise source-plus-language parsing can block on or fail because of an unrelated workspace index."

[[rust.shape.callable.where]]
id        = "daemon-dispatches-syntax-parse-before-live-index-work"
severity  = "error"
expr      = "NOT $daemon_handle_query OR text =~ '(?s)SyntaxParse.*syntax_parse_response.*drain_live_events'"
message   = "The daemon must dispatch `SyntaxParse` before draining live events or refreshing the workspace."
rationale = "Stateless parsing must not read, mutate, or fail because of live workspace indexing."

[[workspace.path]]
id        = "syntax-tree-response-uses-typed-contract"
severity  = "error"
from      = "$syntax_tree_response"
to        = "$syntax_tree_query"
expect    = "reachable"
require_non_empty = true
relation  = ["uses_type"]
max_depth = 2
max_symbols = 20
max_edges = 20
max_pairs = 1
min_coverage = 100
message   = "The daemon AST response no longer consumes the typed `SyntaxTreeQuery` contract: {path}"
rationale = "This fail-closed path proves both the public query contract and its daemon execution boundary still exist and remain connected."

[[workspace.path]]
id        = "syntax-parse-response-uses-typed-contract"
severity  = "error"
from      = "$syntax_parse_response"
to        = "$syntax_parse_query"
expect    = "reachable"
require_non_empty = true
relation  = ["uses_type"]
max_depth = 2
max_symbols = 20
max_edges = 20
max_pairs = 1
min_coverage = 100
message   = "The stateless AST response no longer consumes the typed `SyntaxParseQuery` contract: {path}"
rationale = "This fail-closed path keeps source-plus-language parsing explicit in the public protocol."

[[workspace.path]]
id        = "syntax-parse-response-uses-language-sdk"
severity  = "error"
from      = "$syntax_parse_response"
to        = "$language_parse_source"
expect    = "reachable"
require_non_empty = true
relation  = ["calls"]
max_depth = 2
max_symbols = 20
max_edges = 20
max_pairs = 1
min_coverage = 100
message   = "The stateless AST response bypasses the shared language SDK parser: {path}"
rationale = "The same registered language parsers must serve extraction, indexed AST reads, and direct source parsing."

[[workspace.path]]
id        = "syntax-tree-response-calls-limit-validator"
severity  = "error"
from      = "$syntax_tree_response"
to        = "$syntax_tree_limit_validator"
expect    = "reachable"
require_non_empty = true
relation  = ["calls"]
max_depth = 2
max_symbols = 20
max_edges = 20
max_pairs = 1
min_coverage = 100
message   = "The daemon AST response bypasses its hard-limit validator: {path}"
rationale = "This fail-closed path proves the validator exists and every on-demand syntax-tree response enters it."

[[workspace.path]]
id        = "syntax-parse-response-calls-limit-validator"
severity  = "error"
from      = "$syntax_parse_response"
to        = "$syntax_tree_limit_validator"
expect    = "reachable"
require_non_empty = true
relation  = ["calls"]
max_depth = 2
max_symbols = 20
max_edges = 20
max_pairs = 1
min_coverage = 100
message   = "The stateless AST response bypasses its hard-limit validator: {path}"
rationale = "Direct source parsing must share the same output bounds as indexed syntax trees."

[[workspace.path]]
id        = "mcp-read-delegates-bounded-ast-schema"
severity  = "error"
from      = "$mcp_read_input_schema"
to        = "$mcp_read_ast_schema"
expect    = "reachable"
require_non_empty = true
relation  = ["calls"]
max_depth = 2
max_symbols = 20
max_edges = 20
max_pairs = 1
min_coverage = 100
message   = "`code_moniker_read` no longer delegates to its bounded AST schema: {path}"
rationale = "This fail-closed path proves the public MCP method and its reviewed AST schema renderer both still exist and remain connected."

[[rust.shape.type.where]]
id        = "syntax-tree-query-is-explicitly-bounded"
severity  = "error"
expr      = "NOT $syntax_tree_query OR text =~ '(?s)max_depth.*max_nodes.*named_only.*include_text.*max_text_chars'"
message   = "`SyntaxTreeQuery` must keep explicit depth, node, grammar-node, and source-text bounds."
rationale = """
An AST is an opt-in diagnostic payload, not an unbounded index projection. Keeping every
volume dimension in the typed protocol prevents a single source file from flooding an
agent context or forcing the daemon to retain syntax trees.
"""

[[rust.shape.type.where]]
id        = "syntax-parse-query-is-explicitly-bounded"
severity  = "error"
expr      = "NOT $syntax_parse_query OR text =~ '(?s)language.*source.*uri.*max_depth.*max_nodes.*named_only.*include_text.*max_text_chars'"
message   = "`SyntaxParseQuery` must keep source identity and every AST output bound explicit."
rationale = "Stateless parsing is public protocol input and must remain both self-contained and bounded."

[[rust.shape.callable.where]]
id        = "syntax-tree-daemon-enforces-hard-bounds"
severity  = "error"
expr      = "NOT $syntax_tree_limit_validator OR text =~ '(?s)SYNTAX_TREE_MAX_DEPTH.*SYNTAX_TREE_MAX_NODES.*SYNTAX_TREE_MAX_TEXT_CHARS'"
message   = "`validate_limits` must enforce the shared hard depth, node, and leaf-text limits."
rationale = "Schema defaults are advisory; the daemon boundary must reject oversized direct protocol requests."

[[rust.shape.callable.where]]
id        = "mcp-read-publishes-bounded-ast-options"
severity  = "error"
expr      = "NOT $mcp_read_ast_schema OR text =~ '(?s)\"source\".*\"language\".*\"ast\".*\"max_depth\".*\"max_nodes\".*\"named_only\".*\"include_text\".*\"max_text_chars\"'"
message   = "`code_moniker_read` must publish the complete bounded AST request contract."
rationale = "The agent surface must expose direct source-plus-language parsing and the same bounds enforced by the typed daemon query."

# ─── Daemon lifecycle ownership ─────────────────────────────────────

[[rust.struct.where]]
id        = "daemon-registry-is-process-discovery-only"
severity  = "error"
expr      = "NOT $daemon_registry_entry_contract OR (NOT text =~ '(?m)pub\\s+(state|phase)\\s*:' AND NOT text =~ 'DaemonRegistryState|WorkspacePhase')"
message   = "`DaemonRegistryEntry` must contain process-discovery data only; workspace lifecycle belongs to `workspace.status`."
rationale = "Duplicating loading/ready in the registry makes clients gate transport on index duration and recreates startup timeout loops."

[[rust.struct.where]]
id        = "workspace-status-owns-typed-lifecycle"
severity  = "error"
expr      = "NOT $workspace_status_contract OR (text =~ 'phase\\s*:\\s*WorkspacePhase' AND text =~ 'failure\\s*:\\s*Option<WorkspaceFailureDto>')"
message   = "`WorkspaceStatus` must keep the canonical typed phase and failure cause."
rationale = "Every transport and UI consumes one protocol lifecycle instead of inventing local string states."

[[rust.fn.where]]
id        = "daemon-client-waits-for-transport-not-index"
severity  = "error"
expr      = "NOT $daemon_client_transport_wait OR (text =~ 'connect_entry' AND NOT text =~ 'DaemonRegistryState|WorkspacePhase|workspace_loading|Indexing|Ready')"
message   = "The daemon client startup wait may probe registration and handshake only, never workspace readiness."
rationale = "Index duration is unbounded workspace work; it cannot be a condition for establishing a daemon connection."

[[rust.fn.where]]
id        = "auto-started-daemon-has-no-hidden-supervisor"
severity  = "error"
expr      = "NOT $daemon_client_process_spawn OR NOT text =~ 'supervisor-(pid|fd)'"
message   = "Rust connect-or-start must launch the shared daemon without hidden client lifetime supervision."
rationale = "The daemon must keep indexing after the short-lived client that initiated it has returned."

[[rust.fn.where]]
id        = "protocol-recovery-is-directional"
severity  = "error"
expr      = "NOT $daemon_client_compatibility_policy OR text =~ '(?s)protocol_version < PROTOCOL_VERSION.*RestartDaemon.*protocol_version > PROTOCOL_VERSION.*RejectClient'"
message   = "Protocol recovery must restart an older daemon once and preserve a newer daemon for an older client."
rationale = "A generic mismatch retry can destroy a valid newer index or enter an unbounded restart loop."

[[rust.fn.where]]
id        = "mcp-preload-gate-returns-canonical-state-immediately"
severity  = "error"
expr      = "NOT $mcp_preload_gate OR (text =~ 'WorkspacePhase::Ready' AND text =~ 'WorkspacePhase::Loading' AND text =~ 'WorkspacePhase::Failed' AND NOT text =~ 'sleep|Instant::now|deadline|wait_for_workspace')"
message   = "MCP preload handling must project the canonical workspace phase without a private wait loop."
rationale = "Stdio MCP must answer loading or failed immediately while its background index continues."

[[rust.method.where]]
id        = "mcp-runtime-projects-one-lifecycle-to-status-and-data"
severity  = "error"
expr      = "NOT $mcp_daemon_runtime_query OR text =~ '(?s)current_lifecycle.*ensure_workspace_available.*project_workspace_lifecycle'"
message   = "The in-process MCP runtime must use one `WorkspaceLifecycle` for snapshot gates and `workspace.status`."
rationale = "A separate preload gate without status projection lets data queries report failed while workspace.status remains loading."

[[rust.fn.where]]
id        = "mcp-workspace-status-projects-typed-lifecycle"
severity  = "error"
expr      = "NOT $mcp_lifecycle_projection OR (text =~ 'QueryResult::WorkspaceStatus' AND text =~ 'status.phase = lifecycle.phase' AND text =~ 'status.failure = lifecycle.failure')"
message   = "MCP `workspace.status` must project the same typed phase and failure used by data-query availability checks."
rationale = "The status query is the public lifecycle read model and cannot bypass a failed initial preload."

[[rust.fn.where]]
id        = "daemon-registry-claim-loss-is-typed"
severity  = "error"
expr      = "NOT $daemon_registry_claim_maintenance OR (text =~ 'RegistryClaimFailure::(Read|Missing|Replaced|HeartbeatWrite|HeartbeatRejected)' AND NOT text =~ '\\.ok\\(\\)|\\.flatten\\(\\)|unwrap_or\\(false\\)')"
message   = "Registry claim maintenance must return an explicit failure reason instead of collapsing read and heartbeat errors into claim loss."
rationale = "A daemon exit without the read, replacement, or heartbeat cause leaves clients with only a later no-registration symptom."

[[rust.fn.where]]
id        = "daemon-registry-read-preserves-decode-failures"
severity  = "error"
expr      = "NOT $daemon_registry_entry_read OR (text =~ 'parse_registry_entry' AND NOT text =~ '\\.ok\\(\\)|unwrap_or\\(false\\)')"
message   = "Registry reads must preserve I/O and JSON decode failures instead of reporting an absent daemon."
rationale = "The daemon claim lifecycle can be causal only when its registry primitives do not collapse corrupt state into `None`."

[[rust.fn.where]]
id        = "daemon-registry-heartbeat-preserves-read-failures"
severity  = "error"
expr      = "NOT $daemon_registry_owned_update OR (text =~ 'parse_registry_entry' AND text =~ 'ErrorKind::NotFound' AND NOT text =~ '\\.ok\\(\\)|and_then.*\\.ok\\(\\)')"
message   = "Registry heartbeat ownership checks must distinguish a missing claim from read or decode failures."
rationale = "Only `NotFound` means no owner; corruption and I/O failures must reach the daemon's typed diagnostic path."

[[rust.fn.where]]
id        = "rust-daemon-launch-captures-stderr-without-inheriting-client-pipes"
severity  = "error"
expr      = "NOT $daemon_client_process_spawn OR (text =~ 'daemon_log_path_for_config' AND text =~ 'stderr\\(Stdio::from\\(diagnostic\\)\\)' AND NOT text =~ 'stderr\\(Stdio::inherit')"
message   = "The detached Rust launcher must capture daemon stderr without inheriting a short-lived client's output pipe."
rationale = "The daemon already reports causal diagnostics on stderr. A deterministic file preserves them after detachment while allowing a client that captures its own stderr to receive EOF."

[[ts.function.where]]
id        = "node-daemon-launch-preserves-stderr-diagnostics"
severity  = "error"
expr      = "NOT $node_daemon_process_spawn OR text =~ 'stdio:\\s*\\[\"ignore\",\\s*\"ignore\",\\s*\"inherit\"'"
message   = "The detached Node launcher must preserve the daemon's stderr diagnostics."
rationale = "Rust and Node launchers must expose the same existing daemon diagnostic stream."

[[rust.fn.where]]
id        = "source-groups-are-owned-by-root-workspace-config"
severity  = "error"
expr      = "NOT $source_group_config_scope OR (text =~ 'project_root \\|\\| config.workspace.source_groups.is_empty' AND text =~ 'SourceGroupOutsideProjectRoot')"
message   = "`workspace.source_group` must be accepted only from the canonical project configuration."
rationale = "Fragments, standalone rules, and inline overlays are rule sources; accepting structural mappings there creates an effective rules config that scanning ignores."

[[rust.fn.where]]
id        = "source-group-root-owner-is-path-identity"
severity  = "error"
expr      = "NOT $source_group_root_identity OR (text =~ 'project_root.join\\(\"\\.code-moniker\\.toml\"\\)' AND text =~ 'path.canonicalize' AND text =~ 'expected.canonicalize' AND NOT text =~ 'file_name')"
message   = "The source-group owner must be the analyzed root's exact `.code-moniker.toml`, not any file with that basename."
rationale = "A borrowed `--rules /other/.code-moniker.toml` must not silently contribute structural configuration to another workspace."

[[rust.method.where]]
id        = "ruleset-config-loads-with-explicit-project-root"
severity  = "error"
expr      = "NOT $ruleset_config_loader OR text =~ 'load_project_with_cli_sources'"
message   = "Ruleset loading must pass its explicit project root to structural config validation."
rationale = "The rules path alone cannot prove that workspace mappings belong to the workspace being analyzed."

[[rust.method.where]]
id        = "check-request-binds-rules-to-analyzed-root"
severity  = "error"
expr      = "NOT $check_request_constructor OR text =~ 'rules.with_project_root\\(path.clone\\(\\)\\)'"
message   = "A check request must bind rule loading to the path it analyzes."
rationale = "This closes the `check TARGET --rules /other/.code-moniker.toml` source-group bypass at the shared engine boundary."

[[rust.fn.where]]
id        = "source-group-fragments-use-root-owner-policy"
severity  = "error"
expr      = "NOT $source_group_fragment_parser OR text =~ 'ensure_source_groups_owned_by_project_root'"
message   = "Rule fragments must delegate source-group scope validation to the canonical root-owner policy."
rationale = "A fragment-specific interpretation would recreate a second partial configuration mechanism."

[[refs.where]]
id        = "source-group-config-has-one-loader"
severity  = "error"
expr      = "NOT ($rust_production_source AND kind = 'calls' AND target ~ '**/struct:DeclaredSourceGroups/method:load*') OR source.name = 'discover_scopes'"
message   = "Only source discovery may load declared source groups from workspace configuration."
rationale = "Discovery records the classification on each source file; extraction and linkage must consume that record rather than reparsing configuration."

[[rust.fn.where]]
id        = "source-group-membership-projects-group-and-srcset"
severity  = "error"
expr      = "NOT $source_group_membership_projection OR (text =~ 'membership.group' AND text =~ 'membership.srcset')"
message   = "Source discovery must project both connectivity group and existing srcset identity from one membership lookup."
rationale = "Production/test identity and linkage connectivity are two outputs of the same declared source-group classification."

[[rust.method.where]]
id        = "source-file-extraction-consumes-recorded-srcset"
severity  = "error"
expr      = "NOT $source_file_extraction_context OR text =~ 'self.srcset.as_deref\\(\\)'"
message   = "Extraction must consume the srcset recorded on `SourceFile`."
rationale = "Reclassifying paths during extraction would diverge from discovery and incremental refresh."

[[rust.fn.where]]
id        = "source-group-linkage-consumes-recorded-membership"
severity  = "error"
expr      = "NOT $source_group_linkage_lookup OR text =~ 'source.source_group'"
message   = "Linkage must consume the source-group membership recorded in the source catalog."
rationale = "Linkage must not reload or reinterpret workspace configuration after source discovery."

[[shape.callable.where]]
id        = "daemon-consumers-do-not-own-readiness-waits"
severity  = "error"
expr      = "NOT $daemon_lifecycle_consumer OR NOT name =~ '^(waitUntilReady|wait_until_ready|query_waiting_for_load|wait_for_workspace)$'"
message   = "Daemon consumers must not introduce a workspace-readiness wait helper; consume the typed protocol state."
rationale = "CLI, MCP and Node are adapters, not owners of index readiness policy."

[[shape.callable.where]]
id        = "daemon-consumers-do-not-retry-workspace-loading"
severity  = "error"
expr      = "NOT $daemon_lifecycle_consumer OR NOT (text =~ 'workspace_loading' AND text =~ 'sleep|delay|setTimeout|Instant::now|deadline')"
message   = "Daemon consumers must return `workspace_loading` instead of hiding it behind a retry deadline."
rationale = "Retry timing belongs to the caller UX; embedding it in adapters duplicates lifecycle policy and couples correctness to corpus size."

[[ts.class.where]]
id        = "vscode-session-separates-process-and-workspace-state"
severity  = "error"
expr      = "NOT $vscode_daemon_session OR (text =~ 'connectionStatus\\s*:\\s*DaemonConnectionStatus' AND text =~ 'workspacePhase\\??\\s*:\\s*WorkspacePhase' AND NOT text =~ '(?m)^\\s*status\\s*:\\s*DaemonStatus')"
message   = "VS Code must store connection status and the canonical workspace phase separately; a combined mutable status recreates the daemon state machine."
rationale = "The extension may derive a presentation label, but process availability and index readiness have different owners and recovery policies."

[[ts.method.where]]
id        = "vscode-protocol-recovery-is-directional"
severity  = "error"
expr      = "NOT $vscode_daemon_connect_policy OR text =~ '(?s)ProtocolMismatchError.*direction !== \"daemon_older\".*throw error.*relaunchAndReconnect'"
message   = "VS Code may recycle only an older daemon; a newer daemon must be preserved for its newer clients."
rationale = "The UI launcher must obey the same directional protocol policy as the Rust connect-or-start owner."

# ─── Hex / Layering ─────────────────────────────────────────────────
# Cross-crate refs encode the dependent crate as `external_pkg:<name>` in the
# target moniker. Cargo also enforces these edges, but the rules keep the crate
# dependency matrix explicit in `code-moniker` reports and review tooling.

[[refs.where]]
id      = "core-crate-no-cli"
expr    = "$crate_core AND kind = 'imports_symbol' => NOT target ~ '**/external_pkg:code_moniker_cli/**'"
message = "`code-moniker-core` is the foundation library; it must not depend on the CLI crate."

[[refs.where]]
id      = "workspace-crate-no-cli"
expr    = "$crate_workspace AND kind = 'imports_symbol' => NOT target ~ '**/external_pkg:code_moniker_cli/**'"
message = "`code-moniker-workspace` is a reusable workspace engine; it must not depend on the CLI crate."

[[refs.where]]
id        = "cli-consumes-workspace-public-boundaries"
severity  = "error"
expr      = "$crate_cli AND (kind = 'imports_symbol' OR kind = 'imports_module') AND $workspace_crate_target => $workspace_public_boundary_target"
message   = "`cli` may only import the declared public boundaries of `code-moniker-workspace`."
rationale = """
The workspace crate exposes a reusable engine for CLI/TUI and future MCP adapters. CLI code
should consume the crate through explicit public boundary modules; importing any other
workspace module creates an accidental API and makes internal workspace layout part of the
CLI contract.
"""

[[refs.where]]
id        = "notes-persistence-owned-by-workspace"
severity  = "error"
expr      = "NOT $crate_workspace AND (kind = 'imports_symbol' OR kind = 'imports_module') => NOT $workspace_notes_persistence_target"
message   = "Notes persistence is owned by `code-moniker-workspace`; consumers must go through workspace note state."
rationale = """
Notes are workspace collaboration data. CLI, TUI, MCP, and future adapters may consume note
read models, but they must not load the notes file, compute the notes root, or instantiate
the workspace note state directly. This keeps persistence and live refresh behind the
workspace boundary instead of duplicating file access in each consumer.
"""

[[refs.where]]
id        = "notes-state-owned-by-workspace-index"
severity  = "error"
expr      = "NOT $crate_workspace AND (kind = 'imports_symbol' OR kind = 'imports_module') AND $workspace_notes_state_target => ($cli_workspace_index OR $crate_daemon)"
message   = "`WorkspaceNotes` may only be held by the shared workspace index adapter or the workspace daemon."
rationale = """
`WorkspaceNotes` is the shared state handle for note reload, snapshots, and mutation. CLI
features should not instantiate or hold it directly; they should consume the daemon-backed
contract (or the legacy workspace index while it still exists) so live refresh and MCP/TUI
behavior stay consistent.
"""

[[refs.where]]
id        = "live-watch-roots-owned-by-workspace"
severity  = "error"
expr      = "NOT $crate_workspace => NOT $workspace_live_watch_roots_builder_target"
message   = "Live watch roots are owned by `code-moniker-workspace`; consumers must use the workspace registry surface."
rationale = """
TUI, MCP, and other adapters may run a watcher and handle live events, but the choice of
filesystem, Git, cache, and notes roots is workspace policy. Keeping `watch_roots_for_paths`
inside the workspace crate prevents adapters from duplicating or drifting from the shared
live-refresh contract.
"""

[[refs.where]]
id        = "consumers-use-workspace-live-contract"
severity  = "error"
expr      = "NOT $crate_workspace AND (kind = 'imports_symbol' OR kind = 'imports_module') AND target ~ '**/external_pkg:code_moniker_workspace/path:live/**' => $workspace_live_public_contract_target"
message   = "Consumers may only import the public live contract from `code-moniker-workspace`."
rationale = """
Workspace live policy owns watch root construction, event classification, and refresh planning.
CLI/TUI/MCP adapters may run the watcher and react to public live events, but they must not
consume classifier internals or helper functions that would duplicate workspace policy.
"""

[[refs.where]]
id        = "query-crate-contract-only"
severity  = "error"
expr      = "$crate_query AND (kind = 'imports_symbol' OR kind = 'imports_module') => NOT ($workspace_crate_target OR target ~ '**/external_pkg:code_moniker_check/**' OR target ~ '**/external_pkg:code_moniker_cli/**' OR $daemon_target OR $daemon_client_target)"
message   = "`code-moniker-query` owns only the daemon query contract and must not depend on workspace, check, CLI, daemon, or daemon-client."
rationale = """
The query crate is the compatibility contract shared by Rust and non-Rust clients. Keeping
it free of workspace/check/CLI/daemon dependencies prevents protocol DTOs from drifting into
implementation or presentation models.
"""

[[refs.where]]
id        = "daemon-client-stays-consumer-free"
severity  = "error"
expr      = "$crate_daemon_client AND (kind = 'imports_symbol' OR kind = 'imports_module') => NOT ($daemon_target OR $workspace_crate_target OR target ~ '**/external_pkg:code_moniker_check/**' OR target ~ '**/external_pkg:code_moniker_cli/**')"
message   = "`code-moniker-daemon-client` must not depend on daemon internals, workspace/check, CLI, MCP, TUI, or renderer code."
rationale = """
The daemon client is the reusable transport helper for every product surface. It should know
the daemon protocol and discovery mechanics, not the daemon implementation, workspace/check
runtime, or any individual consumer.
"""

[[refs.where]]
id        = "check-does-not-consume-daemon"
severity  = "error"
expr      = "$crate_check AND (kind = 'imports_symbol' OR kind = 'imports_module') => NOT ($daemon_target OR $daemon_client_target)"
message   = "`code-moniker-check` consumes workspace input directly; it must not depend on daemon lifecycle or daemon clients."
rationale = """
Batch `code-moniker check` is a workspace-domain command. The daemon may expose `rules.check`
for attached clients, but the check engine itself must stay independent of sockets,
daemon discovery, subscriptions, and client state.
"""

[[refs.where]]
id        = "workspace-does-not-consume-daemon-or-query"
severity  = "error"
expr      = "$crate_workspace AND (kind = 'imports_symbol' OR kind = 'imports_module') => NOT ($query_target OR $daemon_target OR $daemon_client_target)"
message   = "`code-moniker-workspace` owns domain facts and must not depend on query protocol or daemon lifecycle crates."
rationale = """
Workspace is the domain boundary. Query protocol, daemon hosting, and client discovery are
outer layers; importing them into workspace would invert the target daemon/workspace design.
"""

[[refs.where]]
id        = "daemon-does-not-render-consumer-formats"
severity  = "error"
expr      = "$crate_daemon AND (kind = 'imports_symbol' OR kind = 'imports_module') => NOT target ~ '**/external_pkg:code_moniker_cli/**'"
message   = "`code-moniker-daemon` must not depend on CLI, MCP, TUI, or other consumer implementation crates."
rationale = """
The daemon is the resident workspace host. Its main contract is query DTOs, while legacy
agent views are exposed as a daemon query during the MCP migration to preserve feature
parity. Even then, the daemon must not import consumer implementation crates; shared
presentation behavior must either live in daemon-owned code or move to a neutral crate.
"""

# ─── Naming hygiene per layer ────────────────────────────────────────
# These extend / refine the embedded preset that already enforces
# PascalCase / snake_case on the obvious cases.

[[rust.shape.callable.where]]
id      = "max-lines"
expr    = "lines <= 120"
message = "{kind} `{name}` is {value} lines (project cap = {expected}). Split it before its host file approaches the 600-line cap."
rationale = """
Long callable bodies are hard for agents and reviewers to localize. Keep the symbol-level
budget lower than the file-level budget so extraction, review, and follow-up edits stay
focused.
"""

[[rust.fn.where]]
id      = "no-placeholder-names"
expr    = "NOT name =~ ^(helper|helpers|do_thing|manage|process)$"
message = "`{name}` is a placeholder. Pick a verb that names the actual behaviour (`extract_*`, `parse_*`, `walk_*`, …)."

[[rust.trait.where]]
id      = "no-i-prefix"
expr    = "NOT name =~ ^I[A-Z]"
message = "Rust trait `{name}` starts with `I` — drop the prefix (`Extractor`, not `IExtractor`)."

# Fixtures under `crates/core/tests/fixtures/` are intentionally arbitrary
# real-code samples used by the snapshot harness; project naming rules
# don't apply to them.
[[ts.function.where]]
id      = "name-camelcase"
expr    = "$tests OR $camel OR name =~ ^[A-Z][A-Za-z0-9]*$ OR name =~ ^__cb_[0-9_]+$"
message = "Functions use camelCase; React-style components may use PascalCase. Rename `{name}`."

# ─── Code smell adoption ───────────────────────────────────────────────
# Smell rules are project-local review signals, not a generic rule pack.
# During adoption, keep a new smell rule at `severity = "warn"` and exclude it
# from guardrail profiles if the volume is not yet understood. Adopted smell
# rules below are `error` guardrails; debt is documented with source-level
# `code-moniker: ignore-file[...]` plus `TODO(smell)` suppressions. Run the
# smell-only view explicitly with:
#
#   code-moniker check . --profile smells --report --max-violations 50
#
# Adopt them one by one: measure the volume, tune scope, thresholds, and exclusions
# when needed, and promote a rule to `severity = "error"` only after the
# targeted module is green or has justified suppressions.

[[rust.shape.callable.where]]
id        = "smell-long-parameter-list"
severity  = "error"
expr      = "count(param) <= 6"
message   = "Long Parameter List candidate: `{name}` has too many direct parameters."
rationale = """
In code-moniker, wide signatures usually mean a missing request/context object or a boundary
that should expose a typed read model.
"""

[[rust.shape.callable.where]]
id        = "smell-feature-envy-local"
severity  = "error"
expr      = "$tests OR $rust_inline_tests OR $example OR kind = 'test' OR kind != 'method' OR count(out_refs) < 40 OR mode(out_refs, target.parent) = source.parent"
message   = "Feature Envy candidate: `{name}` mostly reaches into another local owner."
rationale = """
A Rust method with many local outgoing references should usually collaborate through its own
owner boundary instead of concentrating work around another owner. Tests, examples, and free
functions are excluded while this rule is in adoption.
"""

[[rust.shape.callable.where]]
id        = "smell-caller-concentration"
severity  = "warn"
expr      = "$tests OR $rust_inline_tests OR $example OR kind = 'test' OR visibility != 'public' OR count(in_refs, NOT $rust_test_caller) < 6 OR entropy(in_refs, source.parent, NOT $rust_test_caller) >= 0.5"
message   = "Caller concentration candidate: `{name}` is mainly used by one local owner."
rationale = """
Low incoming-reference entropy is useful for public APIs that look broadly reusable but are
mainly consumed by one local owner. Both the volume guard and the entropy metric operate on the
same production-only reference domain, excluding integration tests, inline test modules,
examples and named test-support modules. Private helpers remain outside this adoption gate.
"""

[[rust.shape.type.where]]
id        = "smell-large-type"
severity  = "error"
expr      = "$tests OR $rust_inline_tests OR $example OR count(shape:callable) <= 25 AND count(shape:value) <= 40"
message   = "Large Type candidate: `{name}` has many direct members."
rationale = """
Large Rust structs/enums/impl owners tend to hide multiple UI, workspace, or check
responsibilities in one local owner.
"""

[[rust.shape.type.where]]
id        = "smell-god-type-local-metrics"
severity  = "error"
expr      = "$tests OR $rust_inline_tests OR $example OR count(shape:callable) < 12 OR wmc(self) <= 47 AND cbo(self) <= 14 AND lcom4(self) <= 2"
message   = "God Type candidate: `{name}` exceeds local OO metric bounds."
rationale = """
The thresholds are heuristic, but they give a stable dogfood signal for complexity,
coupling, and cohesion hotspots.
"""

[[rust.shape.type.where]]
id        = "smell-harmonious-method-size"
severity  = "error"
expr      = "$tests OR $rust_inline_tests OR $example OR count(shape:callable) < 6 OR cv(shape:callable, lines) <= 0.9"
message   = "Distribution smell: method sizes under `{name}` are highly uneven."
rationale = """
A high coefficient of variation often means one method carries the real behavior while
siblings are small adapters. The threshold is intentionally loose while this project rule is
in adoption.
"""

[[rust.shape.type.where]]
id        = "smell-balanced-method-fanout"
severity  = "error"
expr      = "$tests OR $rust_inline_tests OR $example OR count(shape:callable) < 6 OR gini(shape:callable, fan_out(each)) <= 0.65"
message   = "Distribution smell: fan-out under `{name}` is concentrated in a few methods."
rationale = """
A high fan-out Gini coefficient exposes a hidden coupling hub inside an otherwise ordinary
owner.
"""

[[rust.shape.type.where]]
id        = "smell-data-clumps-param-names"
severity  = "error"
expr      = "$tests OR $rust_inline_tests OR $example OR count(shape:callable) < 2 OR count(pairs(shape:callable), size(a.param.name intersect b.param.name) >= 4) = 0"
message   = "Data Clumps candidate: repeated parameter-name groups appear under `{name}`."
rationale = """
Pair-bound collection projections are used here to catch repeated local signatures that
should become explicit types. Four shared names avoids flagging the common tree-sitter
`(node, source, parent)` pattern by itself.
"""

[[rust.shape.callable.where]]
id        = "smell-brain-method"
severity  = "warn"
expr      = "$tests OR $rust_inline_tests OR $example OR kind != 'method' OR lines <= 65 OR fan_out(self) <= 7"
message   = "Brain Method candidate: `{name}` is large and couples to many targets."
rationale = """
A method that concentrates both length and outward reach tends to own the central decision
of its type. Splitting it isolates the dispatching table from the per-case logic, which is
what review and downstream agent edits need. Free functions are exempted because the Brain
Method smell is defined against a host class. CYCLO/MAXNESTING/NOAV are not available in the
local graph, so the detection uses lines + fan_out as a coarser proxy.
"""

[[rust.shape.callable.where]]
id        = "smell-intensive-coupling-method"
severity  = "warn"
expr      = "$tests OR $rust_inline_tests OR $example OR kind != 'method' OR count(out_refs, target.parent != source.parent AND (kind = 'calls' OR kind = 'method_call')) <= 20 OR size(unique(out_refs.target.parent)) >= 6"
message   = "Intensive Coupling candidate: `{name}` funnels many calls into a small set of external owners."
rationale = """
A method whose outgoing calls cross owner boundaries in volume but stay concentrated on a
few external owners is orchestrating work that belongs to those owners. CINT is filtered to
ref kinds `calls` and `method_call` so constructors, type uses, and enum-variant reads do
not inflate the count — only actual invocations register. CDISP is approximated by the count
of distinct external owners; under six keeps the rule on the intensive branch (one method
driving a small ring of collaborators) and off the dispersed one (a different smell). The
20-call threshold is recalibrated above the published L&M Very-High band of 11 because
Rust's file-per-module convention raises baseline cross-owner call counts; tree-sitter AST
visitors and similar dispatcher patterns will still surface and need to be judged on review.
"""

[[rust.shape.type.where]]
id        = "smell-response-for-class"
severity  = "warn"
expr      = "$tests OR $rust_inline_tests OR $example OR count(shape:callable) < 6 OR rfc(self) <= 50"
message   = "High Response For Class candidate: `{name}` has rfc={value}."
rationale = """
A high response surface means a single incoming call can fan out into a large local
subprogram. The cost shows up in testing in isolation, in keeping the public interface
narrow, and in the cognitive load of tracing a single message. The 50 threshold is the
looser end of the Chidamber-Kemerer / Lanza-Marinescu Very-High band; it is conservative for
Rust where trait impls amplify the response count.
"""

[[rust.shape.type.where]]
id        = "smell-brain-class"
severity  = "warn"
expr      = "$tests OR $rust_inline_tests OR $example OR count(shape:callable) < 12 OR wmc(self) <= 47 OR max(shape:callable, lines) <= 65"
message   = "Brain Class candidate: `{name}` is large and contains a dominant method."
rationale = """
A type that combines many methods, high weighted complexity, and at least one dominant
method is the program's local center of gravity. The combination is harder to refactor in
pieces than either factor alone, so flag the conjunction explicitly. TCC is not available;
cohesion is not tested here and the conjunction with the God Class metrics is left to
`smell-god-type-local-metrics` on the same target.
"""

[[rust.module.where]]
id        = "smell-low-cohesion-module"
severity  = "warn"
expr      = "$tests OR $rust_inline_tests OR $example OR count(fn) <= 40 OR sum(shape:type, count(shape:callable)) >= 30"
message   = "Module `{name}` holds many free `fn` items with little behavior anchored to its local types (type-owned callables = {value}); move helpers onto the structs/enums/traits they conceptually belong to, or split the module along those owners."
rationale = """
Module-scope analogue of the procedural-vs-anchored tension that Fowler describes for
entities (Anemic Domain Model, 2003) and Riel for classes (Object-Oriented Design
Heuristics, 1996, #4: 'all data should be hidden within its class'). A module dominated by
free `fn` items whose local types carry no methods sits near the 'coincidental' end of the
Stevens-Myers-Constantine cohesion scale (Structured Design, 1974) -- grouped by file
proximity, not by purpose. Two complementary signals so the rule is structural rather than a
size cap: count(fn) > 40 (enough free callables that a missing host is meaningful, not just
a small helper module) AND sum(shape:type, count(shape:callable)) < 30 (the local
structs/enums/traits collectively carry too little behavior to be the host). Strategy-style
modules with many methods on one host type pass cleanly; junk-drawer modules of free helpers
do not. Cutoffs are calibrated on this repo.
"""

[[rust.shape.type.where]]
id        = "smell-vertical-layout"
severity  = "warn"
expr      = "$tests OR $rust_inline_tests OR $example OR vertical_layout(shape:callable, private_after_first_use, max_gap = 40)"
message   = "Callable layout under `{name}` does not match first-use order."
rationale = """
Clean Code G10 vertical separation signal: private helpers should live close to their first
same-owner caller. The rule is intentionally a warning while thresholds and legitimate
grouping exceptions are inspected.
"""

# ─── Rust idiom smells ──────────────────────────────────────────────────

[[rust.shape.callable.where]]
id        = "smell-unwrap-in-production"
severity  = "warn"
expr      = "NOT $rust_production_source OR $tests OR $rust_inline_tests OR $example OR $rust_test_support OR kind = 'test' OR none(out_refs, kind = 'method_call' AND target.name =~ ^(unwrap|expect|unwrap_err|expect_err)$)"
message   = "Production callable `{name}` calls `.unwrap()`/`.expect()`/`.unwrap_err()`/`.expect_err()`; propagate recoverable errors or isolate the invariant behind an explicit boundary."
rationale = """
Production code must not turn recoverable `Result`/`Option` failures into panics. Use
typed errors, `?`, or explicit boundary handling instead; resolution code in particular
must report typed failures rather than panic on missing state. `expect` is acceptable only
for true invariants where failure means a programmer, build-time, or external contract
breach. Tests, examples, and support harnesses are outside this policy.
"""

[[rust.shape.callable.where]]
id        = "smell-clone-reflex"
severity  = "error"
expr      = "$tests OR $rust_inline_tests OR $example OR count(out_refs, kind = 'method_call' AND target.name = 'clone') <= 3"
message   = "`{name}` clones repeatedly ({value} `.clone()` calls); reconsider borrowing (`&`/`&mut`) or `Cow` before cloning to satisfy the borrow checker."
rationale = """
A burst of `.clone()` calls is the classic way to silence the borrow checker instead of
restructuring ownership; each clone is an allocation/copy. The threshold is heuristic and
loose while the rule is in adoption.
"""

[[rust.shape.callable.where]]
id        = "smell-box-leak"
severity  = "warn"
expr      = "$tests OR $rust_inline_tests OR $example OR none(out_refs, kind = 'method_call' AND target.name = 'leak')"
message   = "`{name}` uses `leak()`; leaking to force a `'static` lifetime trades a compile error for a permanent leak — prefer `OnceLock`, an arena, or restructured ownership."
rationale = """
`Box::leak`/`leak()` is occasionally legitimate for process-lifetime globals, but it is
frequently reached for to escape a lifetime error; the allocation then lives forever.
"""

# ─── Comment hygiene ────────────────────────────────────────────────────

[[rust.comment.where]]
id      = "no-nested-comments"
expr    = "$tests OR $rust_inline_tests OR $example OR parent.kind = 'module' OR text =~ '^//\\s*SAFETY:'"
message = "Do not add comments inside functions, methods, structs, enums, traits, or impls. Keep code self-explanatory; only module-boundary and `SAFETY:` comments are allowed."
rationale = """
Most nested comments become stale micro-rationales or agent narration. Module comments and
unsafe-code `SAFETY:` notes carry durable context; body comments should usually become
clearer code or external docs.
"""

[[rust.comment.where]]
id      = "comment-max-lines"
expr    = "$tests OR $rust_inline_tests OR $example OR text =~ '^//\\s*SAFETY:' OR text =~ '^//!' OR lines <= 4"
message = "Doc/block comment is {value} lines (cap = 4). Move prose to docs/ — see CLAUDE.md comment sobriety."
rationale = """
The extractor collapses adjacent comments into one block, so `lines` measures the length of
that prose block. Inline prose should explain only the local contract; longer rationale belongs
in docs or ADR-style material where future agent sessions can read it deliberately.
"""
