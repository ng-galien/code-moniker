name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-unit:
    name: fmt + clippy + cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: rust

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --tests --no-deps -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: daemon RPC schema is up to date
        run: |
          cargo run -p code-moniker-query --features schema --bin export-schema > schema.actual.json
          diff -u docs/schema/daemon.schema.json schema.actual.json

  typescript-client:
    name: TypeScript client package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/client/package-lock.json

      - name: Install client dependencies
        run: npm ci --omit=optional
        working-directory: packages/client

      - name: Test the public API and package
        run: npm test
        working-directory: packages/client

      - name: Generated client sources match the daemon schema
        run: |
          npm run generate
          git diff --exit-code src/generated.ts src/protocol.ts
        working-directory: packages/client

  vscode-extension:
    name: VS Code extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: vscode-extension

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            vscode-extension/package-lock.json
            packages/client/package-lock.json

      - name: Install VS Code acceptance runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes scrot xvfb

      - name: Install extension dependencies
        run: npm ci
        working-directory: vscode-extension

      - name: Install reusable client dependencies
        run: npm ci --omit=optional
        working-directory: packages/client

      - name: Test and compile the extension
        run: |
          npm test
          npm run compile
        working-directory: vscode-extension

      - name: Run VS Code Playwright acceptance journeys
        run: >-
          xvfb-run -a -s "-screen 0 1600x1000x24"
          bash vscode-extension/scripts/run-playwright-ci.sh test:acceptance

      - name: Retain VS Code Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-playwright-evidence
          path: vscode-extension/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Run external Node consumer against an owned daemon
        run: npm run test:daemon:owned -- ../../target/debug/code-moniker
        working-directory: packages/client

      - name: Package and inspect an autonomous Linux VSIX
        run: |
          cargo build --release -p code-moniker --bin code-moniker
          mkdir -p vscode-extension/bin
          cp target/release/code-moniker vscode-extension/bin/code-moniker
          chmod +x vscode-extension/bin/code-moniker
          cd vscode-extension
          npm run package -- --target linux-x64 --out /tmp/code-moniker-linux-x64.vsix
          unzip -Z1 /tmp/code-moniker-linux-x64.vsix | grep -Fx extension/bin/code-moniker
          unzip -Z1 /tmp/code-moniker-linux-x64.vsix | grep -Fx extension/THIRD_PARTY_NOTICES

  windows-runtime:
    name: Windows daemon + packaged Node client
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: windows-runtime

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/client/package-lock.json

      - name: Test Windows daemon primitives
        run: cargo test -p code-moniker-query -p code-moniker-daemon -p code-moniker-daemon-client

      - name: Build the Windows CLI with daemon support
        run: cargo build -p code-moniker --features mcp

      - name: Install reusable client dependencies
        run: npm ci --omit=optional
        working-directory: packages/client

      - name: Test the reusable client package
        run: npm test
        working-directory: packages/client

      - name: Launch an owned daemon with a custom registry
        run: npm run test:daemon:owned -- ../../target/debug/code-moniker.exe
        working-directory: packages/client

      - name: Install tarballs and launch the packaged Windows daemon
        working-directory: packages/client
        run: npm run test:daemon:packaged -- win32-x64 ../../target/debug/code-moniker.exe

  linux-static-runtime:
    name: Static Linux npm runtime
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain and musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: linux-static-runtime

      - name: Build the static Linux CLI with daemon support
        run: cargo build -p code-moniker --features mcp --target x86_64-unknown-linux-musl

      - name: Reject a dynamic interpreter and run the binary
        run: |
          binary=target/x86_64-unknown-linux-musl/debug/code-moniker
          if readelf --program-headers "$binary" | grep -q 'Requesting program interpreter'; then
            echo "::error::the Linux npm binary is dynamically linked"
            exit 1
          fi
          "$binary" --version

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/client/package-lock.json

      - name: Install tarballs and launch the static packaged daemon
        working-directory: packages/client
        run: |
          npm ci --omit=optional
          npm run test:daemon:packaged -- linux-x64 ../../target/x86_64-unknown-linux-musl/debug/code-moniker

  bench-smoke:
    name: criterion benches compile and run once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Bench smoke (single iteration, no measurement)
        run: cargo bench -p code-moniker-workspace --benches -- --test

  mcp-tests:
    name: mcp feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Clippy on the mcp feature surface
        run: cargo clippy -p code-moniker --features mcp --no-default-features --lib --no-deps -- -D warnings

      - name: Test the mcp feature surface
        run: cargo test -p code-moniker --features mcp --no-default-features --lib
