name: Publish crates

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist release plan
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish crates in dependency order
    runs-on: ubuntu-latest
    environment: release
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: release

      - name: Verify tag matches crates.io package versions
        run: |
          tag="${RELEASE_TAG#v}"
          packages=$(cargo metadata --no-deps --format-version 1 \
                    | jq -r '.packages[]
                      | select(
                          .name == "code-moniker-core"
                          or .name == "code-moniker-query"
                          or .name == "code-moniker-workspace"
                          or .name == "code-moniker-daemon-client"
                          or .name == "code-moniker-check"
                          or .name == "code-moniker-daemon"
                          or .name == "code-moniker"
                        )
                      | "\(.name)=\(.version)"' \
                    | sort)
          package_count=$(printf '%s\n' "$packages" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$package_count" != "7" ]; then
            echo "::error::expected seven crates.io packages, found $package_count: $packages"
            exit 1
          fi
          versions=$(printf '%s\n' "$packages" | cut -d= -f2 | sort -u)
          count=$(printf '%s\n' "$versions" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then
            echo "::error::crates.io packages do not share one version: $packages"
            exit 1
          fi
          version="$versions"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match crates.io package version $version"
            exit 1
          fi

      - name: Authenticate to crates.io via OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.4

      - name: Publish crates in dependency order
        run: |
          version="${RELEASE_TAG#v}"
          publish_crate() {
            crate="$1"
            if curl --user-agent "code-moniker-release-workflow/${version}" \
              --fail --silent --show-error \
              "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
              echo "${crate} ${version} is already published"
              return 0
            fi
            for attempt in 1 2 3 4 5; do
              if cargo publish -p "$crate"; then
                return 0
              fi
              echo "${crate} publish failed on attempt ${attempt}; waiting for crates.io index propagation"
              sleep 30
            done
            return 1
          }
          publish_crate code-moniker-core
          publish_crate code-moniker-query
          publish_crate code-moniker-workspace
          publish_crate code-moniker-daemon-client
          publish_crate code-moniker-check
          publish_crate code-moniker-daemon
          publish_crate code-moniker
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
