fragment = "check"

# Check DSL module boundaries.

[aliases]
dsl_parser = "moniker ~ '**/dir:crates/dir:check/dir:src/*:check/*:expr/**'"
dsl_parser_corpus_tests = "moniker ~ '**/module:/^(snapshots|fuzz)$/**'"
dsl_parser_snapshots = "moniker ~ '**/dir:crates/dir:check/dir:src/*:check/*:expr/*:snapshots/**'"
dsl_parser_fuzz_module = "moniker ~ '**/dir:crates/dir:check/dir:src/*:check/*:expr/*:fuzz'"
dsl_parser_fuzz_tests = "moniker ~ '**/dir:crates/dir:check/dir:src/*:check/*:expr/*:fuzz/**'"
dsl_evaluation = "moniker ~ '**/dir:crates/dir:check/dir:src/*:check/*:eval/**'"
dsl_local_evaluation = "moniker ~ '**/dir:crates/dir:check/dir:src/*:check/*:eval/*:local/**'"
dsl_value_evaluation = "moniker ~ '**/dir:crates/dir:check/dir:src/*:check/*:eval/*:value/**'"
rules_config = "moniker ~ '**/dir:crates/dir:check/dir:src/*:check/*:config/**'"

dsl_evaluation_target = "target ~ '**/*:/^eval$/**'"
rules_config_target = "target ~ '**/*:/^config$/**'"
workspace_runtime_target = """
  target ~ '**/*:/^workspace$/**'
  OR target ~ '**/external_pkg:code_moniker_workspace/path:/^(code|linkage|registry|snapshot|source)$/**'
"""
index_at_workspace_target = """
  target ~ '**/external_pkg:code_moniker_workspace/path:/^(code|linkage|registry|snapshot|source)$/**'
  OR target ~ '**/path:/^(WorkspaceSnapshot|CodeIndex|LinkageSnapshot|SymbolInventoryIndex|CodeIndexMaterial)$/'
"""
dsl_graph_record_target = "target ~ '**/path:/^(CodeGraph|DefRecord|RefRecord)$/'"
rules_fragment_loader_target = "target ~ '**/*:check/*:config/*:fragments/**'"
dsl_multiset_algebra_target = "target ~ '**/method:/^(unique|intersect|union|difference|is_subset)$/'"
dsl_pair_iteration_target = "target ~ '**/method:/^(eval_pair_count|eval_pair_quantifier)$/'"
dsl_named_metric_target = "target ~ '**/method:/^(eval_metric|lcom4|cbo|rfc|wmc|dit|noc|fan_in|fan_out)$/'"
dsl_proptest_macro_target = "target ~ '**/macro:proptest'"

[[refs.where]]
id      = "dsl-parser-separation-of-concerns-preserves-syntax-before-evaluation-rules-config-and-workspace"
expr    = """
  $dsl_parser AND kind = 'imports_symbol'
  => NOT ($dsl_evaluation_target OR $rules_config_target OR $workspace_runtime_target)
"""
message = "`check::expr` owns DSL syntax only; evaluation, config loading, and workspace/project runtime state stay outside the parser."
rationale = """
The parser should produce syntax and AST shapes that are deterministic from the rule text.
Pulling runtime evaluation, rules configuration, or workspace data into parsing would make
rule loading stateful and harder to test in isolation. This boundary covers collection,
pair, and named-metric syntax as parts of the same DSL parser. Pair bindings and metric calls
remain syntax here; iterating data and computing formulas belong to evaluation.
"""

[[rust.shape.callable.where]]
id       = "dsl-parser-test-hygiene-uses-corpus-modules"
severity = "error"
expr     = """
  $dsl_parser AND kind = 'test'
  => $dsl_parser_corpus_tests
"""
message  = "`check::expr` parser test `{name}` is an internal unit test; parser behavior should be covered by corpus/snapshot tests or parser fuzz properties."
rationale = """
Parser tests should survive refactors of grammar functions and parser state. Corpus
snapshots cover expected AST and diagnostics; fuzz tests cover robustness properties without
coupling to parser internals.
"""

[[rust.shape.callable.where]]
id       = "dsl-parser-snapshot-hygiene-uses-insta"
severity = "error"
expr     = """
  $dsl_parser_snapshots AND kind = 'test'
  => any(out_refs, kind = 'calls' AND target.name = 'assert_json_snapshot')
"""
message  = "`check::expr::snapshots` test `{name}` must use `insta::assert_json_snapshot!`."
rationale = """
Parser corpus tests should produce reviewable golden diffs through insta. This keeps parser
tests black-box and prevents hand-written assertions from re-coupling the suite to parser
internals.
"""

[[rust.module.where]]
id       = "dsl-parser-fuzz-hygiene-uses-proptest"
severity = "error"
expr     = """
  $dsl_parser_fuzz_module
  => any(out_refs, kind = 'calls' AND $dsl_proptest_macro_target)
"""
message  = "`check::expr::fuzz` must define parser fuzz properties through `proptest!`."
rationale = """
Parser fuzz coverage should express generated-input robustness properties. Keeping those
tests behind `proptest!` separates them from example-based corpus snapshots and ordinary
unit tests.
"""

[[rust.shape.callable.where]]
id       = "dsl-parser-fuzz-hygiene-covers-robustness"
severity = "error"
expr     = """
  $dsl_parser_fuzz_tests AND kind = 'test'
  => name =~ never_panics
"""
message  = "`check::expr::fuzz` test `{name}` should assert parser robustness, not parser internals."
rationale = """
Fuzz tests are allowed outside the corpus snapshot module only for generated-input
robustness checks. Expected AST shape and diagnostics belong in the snapshot corpus.
"""

[[refs.where]]
id      = "dsl-and-index@workspace-separation-of-concerns-preserves-local-evaluation"
expr    = """
  $dsl_evaluation AND kind = 'imports_symbol'
  => NOT $index_at_workspace_target
"""
message = "`check::eval` evaluates local `CodeGraph` facts only; project-wide indexes and linkage stay out of the local DSL evaluator."
rationale = """
Rule expressions currently evaluate against one local graph item at a time. Keeping project
indexes out of this layer preserves predictable cost and leaves cross-file semantics to
explicit higher-level features. Collection algebra, pair iteration, and named metrics all
inherit this local evaluation boundary. In particular, pair scans remain local and bounded
for hook latency, while named metrics keep the same meaning in file and project checks.
"""

[[refs.where]]
id      = "rules-config-single-responsibility-preserves-static-compilation-before-dsl-evaluation-and-workspace-runtime"
expr    = """
  $rules_config AND kind = 'imports_symbol'
  => NOT ($dsl_evaluation_target OR $workspace_runtime_target)
"""
message = "`check::config` owns TOML/profile/alias loading; it must not evaluate rules or reach workspace runtime state."
rationale = """
Config loading must stay a pure compilation step from TOML to rule specs. If it starts
evaluating against workspaces, `rules show`, hooks, and tests inherit runtime dependencies
they do not need.
"""

[[refs.where]]
id      = "rules-fragment-loader-encapsulation-keeps-merge-internals-private"
expr    = """
  (kind = 'imports_symbol' OR kind = 'imports_module')
  AND $rules_fragment_loader_target
  => $rules_config OR $rust_inline_tests
"""
message = "`check::config::fragments` is loader internals; callers should use the public `check::config` loading API."
rationale = """
Fragment discovery and namespacing are merge internals. Keeping callers on the public config
API lets the loader change fragment mechanics without leaking partial or unmerged rule
state. Rust inline tests are the deliberate exception: they may exercise loader internals
without widening the production API.
"""

# Projected values remain separate from graph traversal.

[[refs.where]]
id      = "dsl-value-and-index@workspace-separation-of-concerns-preserves-projected-values"
expr    = """
  $dsl_value_evaluation AND kind = 'imports_symbol'
  => NOT ($dsl_graph_record_target OR $index_at_workspace_target)
"""
message = "`check::eval::value` is the typed comparison/rendering layer; local graph traversal belongs to `check::eval::local`."
rationale = """
Value evaluation should compare and render already-projected values. Keeping raw graph
traversal out of it avoids a second traversal owner beside `eval::local`.
"""

[[refs.where]]
id      = "dsl-local-evaluation-single-responsibility-excludes-multiset-algebra"
expr    = """
  $dsl_local_evaluation AND kind = 'method_call'
  => NOT $dsl_multiset_algebra_target
"""
message = "`check::eval::local` owns domain traversal and numeric local metrics; it must not absorb multiset algebra from `check::eval::collection`."
rationale = """
Local evaluation may enumerate domains, but set operations need their own algebra and
equality semantics. Centralizing them in `eval::collection` avoids duplicate multiset
behavior.
"""

[[refs.where]]
id      = "dsl-local-evaluation-single-responsibility-excludes-pair-iteration"
expr    = """
  $dsl_local_evaluation AND kind = 'method_call'
  => NOT $dsl_pair_iteration_target
"""
message = "`check::eval::local` owns domain traversal and numeric local metrics; it must not absorb pair iteration from `check::eval::pairs`."
rationale = """
Pair iteration has different cardinality and binding rules from ordinary domain traversal.
Isolating it makes cost and diagnostics easier to reason about.
"""

[[refs.where]]
id      = "dsl-local-evaluation-single-responsibility-excludes-named-metric-formulas"
expr    = """
  $dsl_local_evaluation AND kind = 'method_call'
  => NOT $dsl_named_metric_target
"""
message = "`check::eval::local` owns reusable local traversal/stat helpers; it must not absorb named formulas from `check::eval::metrics`."
rationale = """
Named metrics have domain-specific formulas and should be discoverable in one module.
Leaving them in `eval::local` would turn the shared traversal layer into a metrics grab bag.
"""
