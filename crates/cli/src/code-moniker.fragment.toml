fragment = "cli"

# CLI command dispatcher boundary.

[aliases]
cli_lib = "uri ~ '**/dir:crates/dir:cli/dir:src/module:lib/**'"
cli_command_registry = "uri ~ '**/dir:crates/dir:cli/dir:src/module:args/enum:Command'"
cli_public_export = "require('**/dir:crates/dir:cli/dir:src/module:lib/path:{name}')"
cli_internal_consumer = "source ~ '**/dir:crates/dir:cli/dir:src/**'"
cli_opaque_assertion_macro = "target ~ '**/sdk:rs/path:std/path:macros/macro:/^(assert|assert_eq|assert_ne|debug_assert|debug_assert_eq|debug_assert_ne)$/'"
cli_command_runtime_source = "source ~ '**/dir:crates/dir:cli/dir:src/module:/^(agent|check|daemon|diff|extract|langs|manifest|mcp_command|query|rules|shapes|stats)$/**'"
cli_peer_command_entrypoint = "target ~ '**/dir:crates/dir:cli/dir:src/module:/^(agent|check|daemon|diff|extract|langs|manifest|mcp_command|query|rules|shapes|stats)$/fn:/^(run|run_daemon)$/'"
cli_args_contract_source = "source ~ '**/dir:crates/dir:cli/dir:src/module:args/**'"
cli_extract_runtime_target = "target ~ '**/dir:crates/dir:cli/dir:src/module:extract/**'"
mcp_command_module_target = "target ~ '**/dir:crates/dir:cli/dir:src/module:mcp_command/**'"
cli_exit_conversion = "uri ~ '**/dir:crates/dir:cli/dir:src/module:lib/struct:ExitCode/method:/^from[(]e:Exit[)]$/'"

[[rust.enum.where]]
id       = "cli-command-registry-composition-root-requires-feature-modules"
severity = "error"
expr     = """
$cli_command_registry => all(enum_constant,
  require("**/dir:crates/dir:cli/dir:src/module:{name.snake}")
)
"""
message  = "CLI command variant `{name}` must have a corresponding feature module under `crates/cli/src/{name.snake}`."
rationale = """
`args::Command` is the feature registry at the CLI composition root. Each variant declares a
user-facing capability and must keep the crate module graph in step with that public surface.
Runtime dispatch ownership is a separate invariant enforced at `lib::run`.
"""

# Negotiation sentinels. Warning severity records a concrete architectural
# boundary that is either provisional or already crossed without blocking
# unrelated work. Each rationale states the decision needed to retire or
# promote the warning.

[[refs.where]]
id       = "cli-command-runtime-dependency-avoids-peer-entrypoints"
severity = "warn"
expr     = """
  $cli_command_runtime_source
  AND kind = 'calls'
  AND source.kind != 'test'
  => NOT $cli_peer_command_entrypoint
"""
message  = "CLI command runtime `{source.moniker}` calls peer command entrypoint `{target.moniker}`; shared behavior needs a neutral owner."
rationale = """
Command runtimes should not become APIs for one another. The historical CLI fragment protected
this separation before that rule disappeared during a DSL migration. This warning restores the
executable part of the decision without treating support modules such as `hooks`, `tree`, or
`mcp` as commands. Promote it to error once the command-runtime set and adapter exceptions are
confirmed; refine the aliases if a legitimate peer call is identified.
"""

[[refs.where]]
id       = "cli-extract-runtime-dependency-remains-downstream-of-command-contract"
severity = "warn"
expr     = """
  $cli_args_contract_source
  AND kind = 'imports_module'
  => NOT $cli_extract_runtime_target
"""
message  = "The CLI command contract in `args` imports the `extract` runtime; decide which layer owns the shared parsing vocabulary."
rationale = """
`args` declares the command surface consumed by every runtime, while `extract` implements one
command. The current `args -> extract::Predicate` edge reverses that general direction. Resolve
the warning by moving the predicate contract to `args` or a neutral module, or by documenting
`extract::Predicate` as an intentional command-contract owner and replacing this proposed
boundary with that explicit dependency rule.
"""

[[rust.shape.callable.where]]
id       = "cli-mcp-call-flow-does-not-enter-mcp-command-module"
severity = "warn"
expr     = "$cli_lib AND name = 'run' => none(out_refs, kind = 'calls' AND $mcp_command_module_target)"
message  = "`lib::run` enters the `mcp_command` module; clarify whether it is a CLI adapter or owns MCP runtime policy."
rationale = """
The command registry requires the `mcp` feature module, but the composition root dispatches its
variant through the sibling `mcp_command` module. This may be the correct process adapter, yet
the ownership split is currently implicit. Replace this sentinel with a stable call-flow rule
once `mcp_command` is explicitly accepted as the adapter boundary, or move the dispatch to the
decided owner and promote the resulting ownership rule.
"""

[[rust.shape.type.where]]
id       = "cli-referenced-public-type-encapsulation-requires-crate-export-or-external-consumer"
severity = "error"
expr     = """
  $crate_cli
  AND NOT $cli_lib
  AND visibility = 'public'
  AND count(in_refs) > 0
  => $cli_public_export OR count(in_refs, NOT $cli_internal_consumer) > 0
"""
message  = "`{name}` is `pub` but it is neither exposed by the crate root nor consumed outside `crates/cli/src`; narrow it to `pub(crate)` (or `pub(in …)`)."
rationale = """
`cli` is a leaf binary crate: public types are legitimate when they are part of the crate root
boundary (`lib.rs` reexport) or when a consumer outside `cli/src` uses them. A `pub` type that has
only local incoming references and is not exposed at the crate root overstates the real boundary,
which makes the module graph read as fully connected when consumption is actually local. The
`require(...)` clause is intentional because check rules evaluate one extracted file graph at a
time; the crate-root reexport lives in `lib.rs`, not in the defining file.
"""

[[refs.where]]
id       = "cli-production-call-flow-avoids-opaque-assertion-macros"
severity = "error"
expr     = """
  $crate_cli
  AND kind = 'calls'
  AND source.kind != 'test'
  => NOT $cli_opaque_assertion_macro
"""
message  = "Assertion macro `{target.name}` outside tests can hide domain calls from the Rust extractor; bind the value first or use explicit control flow."
rationale = """
Architecture rules depend on a graph-readable production surface. Rust macros can hide calls
inside token arguments, so a rule based on references may under-count real dependencies. Tests
are excluded: test assertions are a normal testing idiom and should not drive production
modularization rules. In production code, bind the domain value before the macro or use explicit
control flow when the call matters structurally.
"""

[[rust.shape.callable.where]]
id       = "cli-lib-composition-root-limits-callables-to-dispatch-and-process-exit-conversion"
severity = "error"
expr     = "$cli_lib => name = 'run' OR $cli_exit_conversion"
message  = "`lib.rs` callable `{name}` is neither command dispatch nor the `Exit` to `ExitCode` conversion."
rationale = """
`lib.rs` routes `Command::*` to command modules and converts the public command result into the
process exit contract. Only `run` and `ExitCode::from(Exit)` belong on that composition surface;
extra helpers or command runtime would turn the crate root into a hidden implementation.
"""

[[rust.shape.callable.where]]
id       = "cli-lib-hygiene-keeps-inline-tests-out"
severity = "error"
expr     = "$cli_lib => kind != 'test'"
message  = "`lib.rs` must not host inline test `{name}`; test command behavior through command modules or integration tests."
rationale = """
The crate root is a dispatch surface. Inline tests there tend to lock helper functions and
make command relocation harder.
"""

[[rust.shape.callable.where]]
id       = "cli-run-single-responsibility-keeps-command-dispatch-stateless"
severity = "error"
expr     = "$cli_lib AND name = 'run' => count(shape:value) = 3"
message  = "`lib::run` must not introduce local state; delegate each `Command::*` branch directly to the owning command module."
rationale = """
`lib::run` owns the command dispatch boundary only. Its stable symbol shape is the three
dispatcher parameters; additional local values are a strong signal that command logic is
being added inline instead of staying in the command module.
"""
