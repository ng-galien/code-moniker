[package]
name = "code-moniker-tree-sitter-plpgsql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "BSD-3-Clause"
repository.workspace = true
homepage.workspace = true
description = "PL/pgSQL Tree-sitter grammar used by Code Moniker."
keywords = ["tree-sitter", "postgres", "plpgsql", "parser"]
categories = ["parser-implementations", "development-tools"]
build = "build.rs"
include = [
	"build.rs",
	"grammar.js",
	"LICENSE",
	"README.md",
	"src/*",
	"src/tree_sitter/*",
	"tree-sitter.json",
]

[lib]
name = "code_moniker_tree_sitter_plpgsql"

[dependencies]
tree-sitter-language = { workspace = true }

[build-dependencies]
cc = { workspace = true }

[dev-dependencies]
tree-sitter = { workspace = true }
